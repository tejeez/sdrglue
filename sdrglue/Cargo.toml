[package]
name = "sdrglue"
version = "0.1.0"
edition = "2021"

[dependencies]
byteorder = "1.5.0"
clap = { version = "4.5.18", features = ["derive"] }
num = "0.4.3"
num-complex = "0.4.6"
rustfft = "6.4.1"
soapysdr = "0.5.0"
tracing = { version = "0.1.41", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
